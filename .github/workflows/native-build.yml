name: Native build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-core:
    name: Linux core (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libpng-dev libjpeg-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-x64:
    name: Windows x64 (MSVC + Win32 shell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies with runner vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows
      - name: Configure with MSVC and vcpkg
        shell: pwsh
        run: cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build core, tests, and Win32 application
        run: cmake --build build --config Release --parallel 1
      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage portable Windows preview
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "PS-Touch-PC-windows-x64"
          $licenses = Join-Path $stage "licenses"
          New-Item -ItemType Directory -Force -Path $stage, $licenses | Out-Null

          $exe = Join-Path $PWD "build/Release/PS-Touch.exe"
          if (!(Test-Path $exe)) { throw "Expected Windows application was not built: $exe" }
          Copy-Item $exe $stage

          # CMake's configure log confirms vcpkg installs into build/vcpkg_installed,
          # which may differ from VCPKG_INSTALLATION_ROOT on hosted runners.
          $vcpkgRoot = Join-Path $PWD "build/vcpkg_installed/x64-windows"
          $vcpkgBin = Join-Path $vcpkgRoot "bin"
          if (!(Test-Path $vcpkgBin)) {
            throw "Could not locate vcpkg runtime directory: $vcpkgBin"
          }
          $runtimeDlls = Get-ChildItem $vcpkgBin -File -Filter "*.dll" |
            Where-Object { $_.Name -match '^(libpng.*|jpeg.*|turbojpeg.*|zlib.*|z.*)[.]dll$' }
          if (!$runtimeDlls -or $runtimeDlls.Count -eq 0) {
            throw "Could not locate the PNG/JPEG/Zlib runtime DLLs in vcpkg: $vcpkgBin"
          }
          # Windows does not search an arbitrary runtime subfolder for DLLs.
          # Place required runtime DLLs beside the EXE so direct launch works.
          foreach ($dll in $runtimeDlls) { Copy-Item $dll.FullName $stage -Force }

          Copy-Item "README.md" $stage
          Copy-Item "portable/README.txt" (Join-Path $stage "PORTABLE-README.txt")
          @"
          PS Touch PC — Windows x64 preview build
          ========================================
          This is a CI preview artifact, not a 1.0 release.
          Extract the entire folder and run PS-Touch.exe. Keep the included runtime DLLs beside the executable.
          This package has not yet been validated on a clean Windows 10/11 machine.
          See README.md and PORTABLE-README.txt for current limitations.
          "@ | Set-Content -Encoding UTF8 (Join-Path $stage "START-HERE.txt")

          $share = Join-Path $vcpkgRoot "share"
          foreach ($package in @("libpng", "libjpeg-turbo", "zlib")) {
            $copyright = Join-Path $share "$package/copyright"
            if (Test-Path $copyright) {
              Copy-Item $copyright (Join-Path $licenses "$package-copyright.txt")
            }
          }
          if (!(Get-ChildItem $licenses -File -ErrorAction SilentlyContinue)) {
            throw "Dependency license files were not staged."
          }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $env:RUNNER_TEMP "PS-Touch-PC-windows-x64-preview.zip") -Force
      - name: Upload portable Windows preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Touch-PC-windows-x64-preview
          path: ${{ runner.temp }}/PS-Touch-PC-windows-x64-preview.zip
          if-no-files-found: error
          retention-days: 14
